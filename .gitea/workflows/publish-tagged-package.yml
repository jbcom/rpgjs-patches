name: Publish tagged package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable annotated release tag (for example v0.3.0)
        required: true
        type: string
      expected_commit:
        description: Exact commit the annotated tag must peel to
        required: true
        type: string
      expected_sha256:
        description: SHA-256 of the already verified package tarball
        required: true
        type: string

concurrency:
  group: publish-tagged-package-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      REGISTRY_URL: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Activate the repository pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          node --version
          pnpm --version

      - name: Prove immutable source identity
        run: |
          set -euo pipefail
          test "$(git cat-file -t "${RELEASE_TAG}")" = tag
          tag_object="$(git rev-parse "${RELEASE_TAG}")"
          peeled_commit="$(git rev-parse "${RELEASE_TAG}^{}")"
          test "${peeled_commit}" = "${EXPECTED_COMMIT}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"
          remote_name="$(git remote | head -n 1)"
          test -n "${remote_name}"
          git fetch "${remote_name}" main --no-tags
          git merge-base --is-ancestor "${EXPECTED_COMMIT}" "${remote_name}/main"
          package_version="$(node -p "require('./package.json').version")"
          test "v${package_version}" = "${RELEASE_TAG}"
          test -z "$(git status --porcelain --untracked-files=all)"
          {
            echo "tag_object=${tag_object}"
            echo "peeled_commit=${peeled_commit}"
            echo "package_version=${package_version}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source, behavior, builds, and package entry points
        run: pnpm verify

      - id: pack
        name: Pack exactly one immutable artifact
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/rpgjs-patches-release"
          mkdir -p "${artifact_dir}"
          pnpm pack --pack-destination "${artifact_dir}"
          artifact_count="$(find "${artifact_dir}" -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')"
          test "${artifact_count}" = 1
          tarball="$(find "${artifact_dir}" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          actual_sha256="$(sha256sum "${tarball}" | awk '{print $1}')"
          test "${actual_sha256}" = "${EXPECTED_SHA256}"
          archive_version="$(tar -xOf "${tarball}" package/package.json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(data).version))")"
          test "v${archive_version}" = "${RELEASE_TAG}"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${actual_sha256}" >> "${GITHUB_OUTPUT}"
          echo "artifact_sha256=${actual_sha256}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Authenticate only the publish client
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          pnpm config set "//github.com/api/packages/arcade-cabinet/npm/:_authToken" "${GITEA_TOKEN}"

      - name: Publish the already packed bytes
        env:
          npm_config_ignore_scripts: "true"
        run: |
          pnpm publish "${{ steps.pack.outputs.tarball }}" --no-git-checks --access restricted --tag latest

      - name: Prove anonymous metadata, bytes, and fresh ESM/CJS installation
        run: |
          set -euo pipefail
          package_version="${RELEASE_TAG#v}"
          anonymous_config="${RUNNER_TEMP}/anonymous.npmrc"
          node -e "require('node:fs').writeFileSync(process.argv[1], '@arcade-cabinet:registry=' + process.argv[2] + '\n')" "${anonymous_config}" "${REGISTRY_URL}"
          export NPM_CONFIG_USERCONFIG="${anonymous_config}"

          if ! metadata="$(npm view "@arcade-cabinet/rpgjs-patches@${package_version}" --registry="${REGISTRY_URL}" --json)"; then
            echo "Published package metadata is unavailable" >&2
            exit 1
          fi
          metadata_version="$(node -e "const value=JSON.parse(process.argv[1]); process.stdout.write(value.version)" "${metadata}")"
          if ! metadata_latest="$(npm view @arcade-cabinet/rpgjs-patches dist-tags.latest --registry="${REGISTRY_URL}")"; then
            echo "Published package latest dist-tag is unavailable" >&2
            exit 1
          fi
          tarball_url="$(node -e "const value=JSON.parse(process.argv[1]); process.stdout.write(value.dist.tarball)" "${metadata}")"
          test "${metadata_version}" = "${package_version}"
          test "${metadata_latest}" = "${package_version}"

          downloaded_tarball="${RUNNER_TEMP}/published-rpgjs-patches.tgz"
          curl --fail --silent --show-error --location --connect-timeout 30 --max-time 300 "${tarball_url}" --output "${downloaded_tarball}"
          downloaded_sha256="$(sha256sum "${downloaded_tarball}" | awk '{print $1}')"
          test "${downloaded_sha256}" = "${EXPECTED_SHA256}"
          cmp --silent "${{ steps.pack.outputs.tarball }}" "${downloaded_tarball}"

          consumer_dir="$(mktemp -d "${RUNNER_TEMP}/rpgjs-patches-consumer.XXXXXX")"
          node -e "require('node:fs').writeFileSync(process.argv[1], JSON.stringify({name:'published-rpgjs-patches-consumer',private:true,type:'module',dependencies:{'@arcade-cabinet/rpgjs-patches':process.argv[2],canvasengine:'2.2.0','pixi.js':'8.19.0'}}, null, 2) + '\n')" "${consumer_dir}/package.json" "${package_version}"
          node -e "require('node:fs').writeFileSync(process.argv[1], '@arcade-cabinet:registry=' + process.argv[2] + '\n')" "${consumer_dir}/.npmrc" "${REGISTRY_URL}"
          pnpm --dir "${consumer_dir}" install --ignore-scripts --ignore-workspace
          (
            cd "${consumer_dir}"
            node --input-type=module -e "import assert from 'node:assert/strict'; import { createRequire } from 'node:module'; const esm = await import('@arcade-cabinet/rpgjs-patches'); const require = createRequire(import.meta.url); const cjs = require('@arcade-cabinet/rpgjs-patches'); const manifest = require('@arcade-cabinet/rpgjs-patches/package.json'); assert.equal(manifest.version, process.argv[1]); assert.equal(manifest.peerDependencies.canvasengine, '2.2.0'); assert.equal(typeof esm.installCanvasEnginePatches, 'function'); assert.equal(typeof cjs.installCanvasEnginePatches, 'function');" "${package_version}"
          )
          {
            echo "published_version=${metadata_version}"
            echo "published_sha256=${downloaded_sha256}"
            echo "anonymous_esm_cjs_consumer=passed"
          } >> "${GITHUB_STEP_SUMMARY}"
