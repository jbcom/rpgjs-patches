name: CI

on:
  push:
    branches: [main]
  pull_request:


# Supersede an in-flight run when a newer commit lands on the same ref. Without
# this, superseded SHAs stay queued and hold slots on the shared runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Activate the repository pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          node --version
          pnpm --version

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source, behavior, builds, and package entry points
        run: pnpm verify
