name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Activate the repository pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          node --version
          pnpm --version

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source, behavior, builds, and package entry points
        run: pnpm verify
