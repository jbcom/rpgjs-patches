name: Bug report
description: Report a CanvasEngine defect that rpgjs-patches does not repair, or a patch that misbehaves.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting link in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest runnable code sample, the CanvasEngine component involved, and the sequence of lifecycle calls that triggers it.
      render: ts
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "rpgjs-patches, canvasengine, pixi.js, Node.js, package manager, browser, and operating system."
      placeholder: "rpgjs-patches 0.4.0; canvasengine 2.4.0; pixi.js 8.19.0; Node 26; pnpm 12; Chrome 154"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add stack traces, the report returned by installCanvasEnginePatches, or other useful details.
